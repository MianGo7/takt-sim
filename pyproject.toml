[project]
name = "takt"
version = "0.1.0"
description = "Discrete-event simulation of a smart factory production line, comparing maintenance strategies."
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Mian Gohar Ehsan" }]
dependencies = [
    "simpy>=4.1",
    "numpy>=2.1",
    "scipy>=1.14",
    "pandas>=2.2",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/takt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# E, F, W: pycodestyle and pyflakes. I: import order. N: naming. UP: modern
# syntax. B: likely bugs. SIM: simplifications. D: docstrings. NPY: NumPy
# rules, which include the ban on the legacy global random state.
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "D", "NPY"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test names state the behaviour, so a docstring would only repeat them.
"tests/*" = ["D"]
